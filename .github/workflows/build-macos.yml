name: Build macOS Plugin

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install Dependencies
      run: |
        brew install cmake
        # 确保 Xcode Command Line Tools 就绪
        xcode-select --install || true

    - name: Build Plugin
      run: |
        mkdir -p build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        cmake --build . --config Release -j2   # 使用 2 个核心加速

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: vision-background-removal.plugin
        path: build/vision-background-removal.plugin
        if-no-files-found: error
        retention-days: 30
