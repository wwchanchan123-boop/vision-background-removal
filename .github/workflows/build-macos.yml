name: Build macOS Plugin

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install Dependencies
      run: |
        brew install cmake
        xcode-select --install || true

    - name: Run Official Build Script
      run: |
        chmod +x .github/scripts/build-macos.sh
        cd .github/scripts
        ./build-macos.sh

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: vision-background-removal.plugin
        path: |
          build/vision-background-removal.plugin
          build/vision-background-removal.plugin/*
        if-no-files-found: error
        retention-days: 30
