name: Build macOS Plugin

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install Dependencies
      run: brew install cmake

    - name: Run Original Build Script
      run: |
        chmod +x .github/scripts/build-macos.sh
        cd .github/scripts
        ./build-macos.sh

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: vision-background-removal.plugin
        path: build/vision-background-removal.plugin
        retention-days: 30
