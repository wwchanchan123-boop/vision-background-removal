name: Build macOS Plugin

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install Dependencies
      run: |
        brew install cmake
        xcode-select --install || true

    - name: Run Build Script with CI Fix
      run: |
        # 创建 build 目录并配置 CMake（强制使用 headers，不找 OBS.app）
        mkdir -p build && cd build
        
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DOBS_SOURCE_DIR="$GITHUB_WORKSPACE/deps/obs-studio" \
          -DOBS_APP_PATH="" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0

        cmake --build . --config Release --parallel 2

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: vision-background-removal.plugin
        path: |
          build/vision-background-removal.plugin
          build/vision-background-removal.plugin/**
        if-no-files-found: error
        retention-days: 30
